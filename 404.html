<script>
// Adresse inconnue (ex. /brief.html#s=…) : retour à la page de brief, à la racine, en gardant le jeton et la langue.
// La cible commence toujours par « / » suivi de « ? » ou « # » : elle reste sur ce site.
try {
  var q = /[?&](s|lang)=/.test(location.search) ? location.search : "";
  location.replace("/" + q + location.hash);
} catch (e) { /* rien : le texte ci-dessous reste affiché */ }
</script>
